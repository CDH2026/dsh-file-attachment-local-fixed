# dsh-file-attachment 补丁行：挂载本插件（Host 半提供 file-attachment 服务写临时目录；Client 半监听拖拽/粘贴）
# name 必须等于 package.json 的 name（loader 按该名从 profile 的 node_modules 解析插件模块）。
# 本包是 @wszhoho/dsh-file-attachment 0.6.2 的本地修复分支，包名已改为 dsh-file-attachment-local-fixed，
# 因此不能沿用上游的 '@wszhoho/dsh-file-attachment'，否则 loader 解析不到本包。
- insert:
    - id: dsh-file-attachment
      name: 'dsh-file-attachment-local-fixed'
